# BLML chat stack: Postgres + BLML server (serving the web app).
#
#   1. ./gen-config.sh          # regenerate blml.conf from secrets.env
#   2. docker compose up -d --build
#   3. open http://localhost:6060
#
# First run initializes the database schema automatically (init-db in the
# blml-init service). No sample data is loaded — create accounts via Sign Up.
#
# In production, put a TLS reverse proxy (Caddy/nginx) or the server's own
# ACME support in front of port 6060 — see ../SETUP.md.

name: blml

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in secrets.env — run "set -a; source secrets.env" or use --env-file}
      # No POSTGRES_DB here: init-db creates the "tinode" database itself and
      # fails if an empty one already exists.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the schema if missing, upgrades it if the server version
  # moved ahead. Safe to run on every `up` — exits 0 quickly when nothing to do.
  blml-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/opt/blml/init-db"]
    command: ["--config=/etc/blml/blml.conf", "--upgrade"]
    volumes:
      - ./blml.conf:/etc/blml/blml.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  blml:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      # Locally this is reachable from phones on the same wifi, so it binds to
      # every interface. Production sets BLML_BIND=127.0.0.1: Caddy terminates
      # TLS and reaches the server over the compose network, and nothing but
      # 80/443 is exposed. See docker-compose.prod.yml.
      - "${BLML_BIND:-0.0.0.0}:6060:6060"
    volumes:
      - ./blml.conf:/etc/blml/blml.conf:ro
      # Firebase service-account key, used to send push. gen-config.sh keeps an
      # empty placeholder here when push is off: a bind mount whose source is
      # missing becomes a directory, and the server then fails reading it.
      # Only this service needs it — blml-init never sends anything.
      - ./fcm-service-account.json:/etc/blml/fcm-service-account.json:ro
      - uploads:/var/blml/uploads
    depends_on:
      db:
        condition: service_healthy
      blml-init:
        condition: service_completed_successfully

  # Operator dashboard: member list, last-seen, storage, invite code. Read-only,
  # token-guarded, and published on loopback ONLY — even someone on the home
  # wifi cannot reach it. On a VPS keep the 127.0.0.1 binding and reach it
  # through an SSH tunnel: ssh -L 6061:localhost:6061 <vps>.
  admin:
    build: ./admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:6061:6061"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in secrets.env}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    depends_on:
      db:
        condition: service_healthy

  # Local SMTP catcher for developing/verifying the email-verification flow
  # without real mail credentials. Web UI on :8025 shows every sent message.
  # In production, point SMTP_SERVER at a real provider and drop this service.
  mailpit:
    image: axllent/mailpit:latest
    container_name: blml-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pgdata:
  uploads:
