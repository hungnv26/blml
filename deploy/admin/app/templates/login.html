{% extends "base.html" %}{% block body %}
<div class="centre">
  <h1>BLML admin</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="card">
    <label>Operator<input name="username" autocomplete="username" autofocus required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    {% if totp_required %}<label>Authenticator code<input name="totp" inputmode="numeric" autocomplete="one-time-code" required></label>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
