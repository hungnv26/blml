// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'

        // For FCM push notifications
        classpath 'com.google.gms:google-services:4.4.4'

        // Crashlytics
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // Legal compliance: plugin to collect and display OSS licenses.
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// This block encapsulates custom properties and makes them available to all
// modules in the project.
ext {
    version_code = gitVersionCode()
    version_name = gitVersionName()
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com/' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

// BLML versioning.
//
// Upstream derived these from `git rev-list --count` and `git describe --tags`.
// That breaks here: this repo was flattened from four upstream clones and has no
// version tags, so `git describe` returns "" and .substring(1) throws
// "begin 1, end 0, length 0" before the build even starts.
//
// Bump BLML_VERSION_CODE for every Play upload (must strictly increase);
// BLML_VERSION_NAME is what users see.
static def gitVersionCode() {
    return 1
}

static def gitVersionName() {
    return "1.0.0"
}
