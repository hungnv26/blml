<!-- Served from our own server rather than a CDN. A third-party script runs with
     full access to the page, so a compromised CDN would mean reading every message
     and stealing the session token; these files are pinned copies instead, and the
     browser makes no third-party request to load the app.
     The polyfill-fastly.io tag that used to sit here was removed: the service does
     not carry Intl.Segmenter ("These features were not recognised"), so it shipped
     an empty bundle to every visitor while leaking their IP to a third party. -->
